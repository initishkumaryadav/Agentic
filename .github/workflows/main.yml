name: Enterprise Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'Agentic'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/home/ubuntu/Agentic"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git pull origin main
            if [ -f ".venv/bin/activate" ]; then
              source .venv/bin/activate
            elif [ -f "venv/bin/activate" ]; then
              source venv/bin/activate
            else
              python3 -m venv .venv
              source .venv/bin/activate
            fi
            pip install -r requirements.txt
            if sudo systemctl list-unit-files | grep -q '^streamlit.service'; then
              sudo systemctl restart streamlit
            else
              echo "streamlit.service not found; skipping restart."
            fi
