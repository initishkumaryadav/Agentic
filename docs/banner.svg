<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ColdRoute AI: Helping every delivery arrive fresh, safe and on time.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F2A"/>
      <stop offset="1" stop-color="#123B4F"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FA8C8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5FA8C8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9ED8EE" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>

  <!-- dotted route line with stops -->
  <path d="M60 268 C 300 200, 420 300, 640 250 S 1000 190, 1220 236" fill="none" stroke="url(#route)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="60" cy="268" r="6" fill="#5FA8C8"/>
  <circle cx="640" cy="250" r="6" fill="#5FA8C8"/>
  <circle cx="1220" cy="236" r="8" fill="#9ED8EE"/>
  <circle cx="1220" cy="236" r="16" fill="none" stroke="#9ED8EE" stroke-opacity="0.4" stroke-width="2"/>

  <!-- snowflake mark -->
  <g transform="translate(150 132)" stroke="#9ED8EE" stroke-width="5" stroke-linecap="round" fill="none">
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-46"/>
      <polyline points="-11,-34 0,-24 11,-34"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>

  <text x="232" y="138" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#FFFFFF" letter-spacing="-1">ColdRoute <tspan fill="#9ED8EE">AI</tspan></text>
  <text x="235" y="184" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="26" fill="#C9DDE6">Helping every delivery arrive fresh, safe and on time.</text>
  <text x="1220" y="60" text-anchor="end" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" fill="#7FA9BC" letter-spacing="2">AGENTIC AI · COLD-CHAIN LOGISTICS</text>
</svg>
